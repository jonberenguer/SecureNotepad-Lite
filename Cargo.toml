[package]
name = "secure-note"
version = "1.0.0"
edition = "2021"
description = "SecureNote — AES-256-GCM encrypted notepad, native egui desktop app"

[[bin]]
name = "secure-note"
path = "src/main.rs"

[dependencies]
# Native GUI — wgpu backend avoids the OpenGL 2.0 requirement on Windows.
# wgpu is listed directly so we can configure the adapter request.
eframe = { version = "0.27", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",       # use wgpu instead of glow — no OpenGL 2.0+ required
] }
egui  = "0.27"
wgpu  = "0.19"   # must match the version eframe 0.27 uses internally

# Crypto (same as web version — notes.enc compatible)
aes-gcm  = "0.10"
pbkdf2   = { version = "0.12", features = ["hmac"] }
sha2     = "0.10"
hmac     = "0.12"
rand     = "0.8"
subtle   = "2"
hex      = "0.4"
base64   = "0.22"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Native file dialogs (export / import)
rfd = "0.14"

# Zeroise sensitive memory on lock/exit
zeroize = { version = "1", features = ["alloc"] }

# Wayland and X11 support — Linux only; these features pull in native libs
# that don't exist on Windows/macOS and would break cross-platform builds.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.27", default-features = false, features = [
    "wayland",
    "x11",
] }

[build-dependencies]
image       = { version = "0.24", default-features = false, features = ["png"] }
ico         = "0.3"
winresource = "0.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

